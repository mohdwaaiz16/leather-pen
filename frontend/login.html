<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Leather Production Intelligence</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body { background-color: var(--color-bg); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-container { display: flex; width: 900px; max-width: 95%; background: var(--color-bg); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid var(--color-border); }
        .login-panel { flex: 1; padding: 4rem; display: flex; flex-direction: column; justify-content: center; }
        .brand-panel { flex: 1; background-color: var(--color-primary); color: var(--color-bg); padding: 4rem; display: flex; flex-direction: column; justify-content: center; }
        .brand-panel h1 { color: var(--color-bg); font-size: 2.5rem; letter-spacing: -0.02em; margin-bottom: 1rem; line-height: 1.1; }
        .brand-panel p { color: rgba(255, 255, 255, 0.7); font-size: 1.125rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-panel">
            <h1>Leather Production Intelligence</h1>
            <p>Precision color and production intelligence for leather manufacturing.</p>
        </div>
        <div class="login-panel">
            <h2 style="margin-bottom: 2rem;">Sign In</h2>
            <form onsubmit="event.preventDefault(); auth.login('demo', 'demo');">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="operator@tannery.com" disabled>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" disabled>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding: 0.75rem; margin-bottom: 1rem;" disabled>Sign In</button>
                <button type="button" class="btn btn-secondary" style="width:100%; padding: 0.75rem;" onclick="auth.login('demo', 'demo')">Login as Demo Operator</button>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
